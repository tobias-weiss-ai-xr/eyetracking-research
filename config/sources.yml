# Eyetracking / Vision / Gaze research ingestion sources
#
# Each source resolves to one of:
#   - RSS/Atom feed      : {"type": "rss", "url": "..."}
#   - arXiv API query     : {"type": "arxiv", "categories": [...], "max": N}
#   - GitHub release feed : {"type": "github", "repos": ["owner/name", ...]}
#   - structured catalog  : {"type": "cisa_kev", "url": "..."}  (JSON)
#
# `category` is a coarse digest bucket: paper | changelog | discussion
# `weight` biases relevance scoring for higher-trust sources.
#
# ── Anti-saturation controls ──────────────────────────────────────────────
#   recent_days        : drop items published/added older than N days.
#   default_recent_days: applied to RSS + catalog sources that omit it.
#   max_items          : hard cap on raw items kept from one source.
#   max_source_share   : cap a single source's share of the digest slots.

default_recent_days: 0        # normal RSS feeds return recent items already;
                             # only archive/catalog feeds opt in via recent_days
max_source_share: 0.40       # no source may take >40% of the digest
fresh_window_days: 3
min_score: 0.4
max_digest_items: 60

sources:
  # ---------- Papers: Vision & Eyetracking ----------
  - name: arxiv-cs-cv
    type: arxiv
    categories: ["cs.CV"]
    max: 50
    category: paper
    weight: 2.5
    min_topics: 1
    recent_days: 0

  - name: arxiv-psyc
    type: arxiv
    categories: ["q-bio.QM"]
    max: 30
    category: paper
    weight: 2.0
    min_topics: 1
    recent_days: 0

  - name: arxiv-hci
    type: arxiv
    categories: ["cs.HC"]
    max: 30
    category: paper
    weight: 2.0
    min_topics: 1
    recent_days: 0

  # ---------- Journals: Vision Research ----------
  - name: vision-research-journal
    type: rss
    url: "https://www.sciencedirect.com/journal/vision-research/rss"
    category: paper
    weight: 2.5
    recent_days: 30

  - name: jov-rss
    type: rss
    url: "https://jov.arvojournals.org/rss/current.xml"
    category: paper
    weight: 2.5
    recent_days: 30

  - name: journal-of-eye-movement-research
    type: rss
    url: "https://bop.unibe.ch/JEMR/feed/"
    category: paper
    weight: 2.5
    recent_days: 30

  # ---------- Conferences ----------
  - name: etra-conference
    type: rss
    url: "https://etra.acm.org/feed.xml"
    category: paper
    weight: 2.3
    recent_days: 30

  - name: eye-tracking-research-applications
    type: rss
    url: "https://link.springer.com/journal/12369/rss"
    category: paper
    weight: 2.2
    recent_days: 30

  # ---------- Tooling / libraries ----------
  - name: openface-releases
    type: github
    repos:
      - "TadasBaltrusaitis/OpenFace"
      - "GazeMapping/GazeMapping"
      - "esdalmaijer/PyGaze"
      - "InfraRedLab/Pupil-Labs-PyPupil"
    category: changelog
    weight: 1.5
    recent_days: 0

  - name: tobii-sdk
    type: github
    repos:
      - "tobii/tobii-sdk"
      - "tobii/tobii-pro-sdk"
    category: changelog
    weight: 1.4
    recent_days: 0

  # ---------- CVPR/ICCV Eyetracking papers ----------
  - name: cvpr eyedata
    type: arxiv
    categories: ["cs.CV"]
    max: 20
    category: paper
    weight: 2.3
    min_topics: 1
    recent_days: 0

