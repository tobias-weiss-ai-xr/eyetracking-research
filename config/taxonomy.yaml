# ⚙️ Eyetracking Research Taxonomy & Discovery Config
#
# Edit categories/subcategories + discovery queries, then re-run the pipeline.
# Pipeline:  config/taxonomy.yaml → papers.yaml → validate → README → reports

# ── Topic ────────────────────────────────────────────────────────────────────
topic:
  name: "Eyetracking & Gaze Analysis Research"          # shown in README header
  short: "eyetracking-research"                   # used in URLs, badges, docs paths
  description: "Comprehensive corpus of research on eyetracking technology, gaze analysis, visual attention, and human-computer interaction using eye gaze."
  openalex_mailto: "research@graphwiz.ai"

# ── Taxonomy ─────────────────────────────────────────────────────────────────
# Categories = the main axis of your review (e.g. methods, applications, …).
# Subcategories = the secondary axis (e.g. architectures, benchmarks, …).
# Every paper in papers.yaml must carry one category + one subcategory.
taxonomy:
  categories:                           # ordered list
    - id: hardware
      display: "Hardware & Technology"
    - id: algorithms
      display: "Gaze Analysis Algorithms"
    - id: applications
      display: "Applications & Use Cases"
    - id: psychology
      display: "Cognitive & Psychological Studies"
    - id: hci
      display: "Human-Computer Interaction"
    - id: vr_ar
      display: "VR, AR & XR"
    - id: ml_ai
      display: "Machine Learning & AI"
    - id: evaluation
      display: "Evaluation & Benchmarks"
    - id: survey
      display: "Surveys & Reviews"
  
  subcategories:
    # Hardware
    - id: eye_trackers
      display: "Eye Tracking Devices"
      category: hardware
    - id: calibration
      display: "Calibration Methods"
      category: hardware
    - id: infrared
      display: "Infrared-Based Tracking"
      category: hardware
    - id: pupillometry
      display: "Pupillometry"
      category: hardware
    
    # Algorithms
    - id: gaze_estimation
      display: "Gaze Estimation"
      category: algorithms
    - id: fixation_detection
      display: "Fixation Detection"
      category: algorithms
    - id: saccade_detection
      display: "Saccade Detection"
      category: algorithms
    - id: scanpath_analysis
      display: "Scanpath Analysis"
      category: algorithms
    - id: heatmap_generation
      display: "Heatmap Generation"
      category: algorithms
    
    # Applications
    - id: assistive_tech
      display: "Assistive Technology"
      category: applications
    - id: medical
      display: "Medical & Diagnostic"
      category: applications
    - id: marketing
      display: "Marketing & Advertising"
      category: applications
    - id: education
      display: "Education & Training"
      category: applications
    - id: automotive
      display: "Automotive"
      category: applications
    - id: gaming
      display: "Gaming & VR"
      category: applications
    
    # Psychology
    - id: visual_perception
      display: "Visual Perception"
      category: psychology
    - id: attention
      display: "Attention Mechanisms"
      category: psychology
    - id: reading
      display: "Reading Research"
      category: psychology
    - id: developmental
      display: "Developmental Studies"
      category: psychology
    - id: clinical
      display: "Clinical Psychology"
      category: psychology
    
    # HCI
    - id: gaze_interfaces
      display: "Gaze-Based Interfaces"
      category: hci
    - id: fitts_law
      display: "Fitts' Law Applications"
      category: hci
    - id: usability
      display: "Usability Testing"
      category: hci
    - id: input_methods
      display: "Gaze Input Methods"
      category: hci
    
    # VR, AR & XR
    - id: et_in_vr
      display: "Eyetracking in VR"
      category: vr_ar
    - id: et_in_ar
      display: "Eyetracking in AR"
      category: vr_ar
    - id: foveated_rendering
      display: "Foveated Rendering"
      category: vr_ar
    - id: vr_interaction
      display: "VR Interaction Techniques"
      category: vr_ar
    - id: vr_hardware
      display: "VR Eye Tracking Hardware"
      category: vr_ar
    
    # ML/AI
    - id: saliency_prediction
      display: "Saliency Prediction"
      category: ml_ai
    - id: attention_models
      display: "Attention Models"
      category: ml_ai
    - id: gaze_synthesis
      display: "Gaze Synthesis"
      category: ml_ai
    - id: transformers
      display: "Transformer-Based Models"
      category: ml_ai
    - id: foveated_vision
      display: "Foveated Vision"
      category: ml_ai
    
    # Evaluation
    - id: benchmarks
      display: "Benchmark Datasets"
      category: evaluation
    - id: metrics
      display: "Evaluation Metrics"
      category: evaluation
    - id: comparisons
      display: "Comparative Studies"
