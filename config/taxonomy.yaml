# ── Discovery: arXiv queries (fetch_new_papers.py) ───────────────────────────
# Eyetracking-specific arXiv queries
arxiv_queries:
  # Hardware & Technology
  - query: 'cat:cs.CV AND (abs:"eye tracking device" OR abs:"gaze tracker" OR abs:"oculomotor")'
    category: hardware
    subcategory_hint: eye_trackers
  
  - query: 'cat:cs.CV AND (abs:"eye tracking calibration" OR abs:"gaze calibration" OR abs:"calibration method")'
    category: hardware
    subcategory_hint: calibration
  
  - query: 'cat:cs.CV AND (abs:"infrared eye tracking" OR abs:"IR eye tracker" OR abs:"purkinje")'
    category: hardware
    subcategory_hint: infrared
  
  - query: 'cat:q-bio.QM AND (abs:"pupillometry" OR abs:"pupil dilation" OR abs:"pupil response")'
    category: hardware
    subcategory_hint: pupillometry
  
  # Gaze Analysis Algorithms
  - query: 'cat:cs.CV AND (abs:"gaze estimation" OR ti:"gaze estimation" OR abs:"eye gaze estimation")'
    category: algorithms
    subcategory_hint: gaze_estimation
  
  - query: 'cat:cs.CV AND (abs:"fixation detection" OR abs:"fixation identification" OR abs:"saccade detection")'
    category: algorithms
    subcategory_hint: fixation_detection
  
  - query: 'cat:cs.CV AND (abs:"scanpath analysis" OR abs:"gaze scanpath" OR abs:"eye movement pattern")'
    category: algorithms
    subcategory_hint: scanpath_analysis
  
  - query: 'cat:cs.CV AND (abs:"gaze heatmap" OR abs:"heat map" OR abs:"visual attention map")'
    category: algorithms
    subcategory_hint: heatmap_generation
  
  # Saliency Prediction
  - query: 'cat:cs.CV AND (abs:"saliency prediction" OR abs:"visual saliency" OR abs:"saliency map")'
    category: ml_ai
    subcategory_hint: saliency_prediction
  
  - query: 'cat:cs.CV AND (abs:"attention model" OR abs:"visual attention model")'
    category: ml_ai
    subcategory_hint: attention_models
  
  - query: 'cat:cs.LG AND (abs:"attention mechanism" OR abs:"self-attention" OR abs:"transformer attention")'
    category: ml_ai
    subcategory_hint: transformers
  
  - query: 'cat:cs.CV AND (abs:"foveated vision" OR abs:"foveated rendering" OR abs:"foveation")'
    category: ml_ai
    subcategory_hint: foveated_vision
  
  # Applications
  - query: 'cat:cs.HC AND (abs:"gaze-based interface" OR abs:"eye-controlled" OR abs:"gaze interaction")'
    category: hci
    subcategory_hint: gaze_interfaces
  
  - query: 'cat:cs.HC AND (abs:"gaze input" OR abs:"eye tracking HCI" OR abs:"eye-computer interaction")'
    category: hci
    subcategory_hint: input_methods
  
  - query: 'cat:cs.HC AND (abs:"usability testing" OR abs:"eye tracking usability")'
    category: hci
    subcategory_hint: usability
  
  - query: 'cat:q-bio.QM AND (abs:"visual attention" OR abs:"attention mechanism" OR abs:"eyes movements")'
    category: psychology
    subcategory_hint: attention
  
  - query: 'cat:q-bio.QM AND (abs:"reading" OR abs:"eye movements reading" OR abs:"saccadic reading")'
    category: psychology
    subcategory_hint: reading
  
  # VR & AR
  - query: 'cat:cs.CV AND (abs:"virtual reality" OR abs:"VR") AND (abs:"eye tracking" OR abs:"gaze")'
    category: vr_ar
    subcategory_hint: et_in_vr
  
  - query: 'cat:cs.CV AND (abs:"augmented reality" OR abs:"AR") AND (abs:"eye tracking" OR abs:"gaze")'
    category: vr_ar
    subcategory_hint: et_in_ar
  
  - query: 'cat:cs.CV AND (abs:"foveated rendering" OR abs:"foveated graphics" OR abs:"peripheral vision rendering")'
    category: vr_ar
    subcategory_hint: foveated_rendering
  
  - query: 'cat:cs.CV AND (abs:"VR interaction" OR abs:"virtual reality interaction" OR abs:"gaze-based VR")'
    category: vr_ar
    subcategory_hint: vr_interaction
  
  - query: 'cat:cs.CV AND (abs:"VR headset" OR abs:"HMD" OR abs:"eye tracking HMD") AND (abs:"eye" OR abs:"gaze")'
    category: vr_ar
    subcategory_hint: vr_hardware
  
  # Medical & Assistive
  - query: 'cat:cs.HC AND (abs:"assistive technology" OR abs:"gaze-controlled wheelchair" OR abs:"eye-controlled communication")'
    category: applications
    subcategory_hint: assistive_tech
  
  - query: 'cat:q-bio.QM AND (abs:"ADHD" OR abs:"autism" OR abs:"neurological" OR abs:"clinical")'
    category: psychology
    subcategory_hint: clinical
  
  - query: 'cat:cs.CV AND (abs:"medical imaging" OR abs:"diagnostic" OR abs:"biomedical") AND (abs:"eye" OR abs:"gaze")'
    category: applications
    subcategory_hint: medical
  
  # Surveys
  - query: 'cat:cs.CV AND (abs:"survey" OR ti:"survey" OR abs:"review") AND (abs:"eye tracking" OR abs:"gaze analysis")'
    category: survey
    subcategory_hint: literature_review
  
  - query: 'cat:q-bio.QM AND (ti:"state of the art" OR abs:"state-of-the-art") AND (abs:"eye movement" OR abs:"gaze")'
    category: survey
    subcategory_hint: state_of_the_art

# ── Discovery: multi-source queries (fetch_other_sources.py) ─────────────────
other_sources_queries:
  - source: dblp
    query: eyetracking gaze analysis visual attention
    category: algorithms
    subcategory_hint: gaze_estimation
  - source: crossref
    query: eye tracking human-computer interaction gaze
    category: hci
    subcategory_hint: gaze_interfaces
  - source: europepmc
    query: pupillometry cognitive load visual perception
    category: psychology
    subcategory_hint: visual_perception

# ── OpenAlex bulk fetch (fetch_openalex_bulk.py) ─────────────────────────────
openalex_queries:
  - category: hardware
    query: "eye tracking gaze tracker hardware technology"
  - category: algorithms
    query: "gaze estimation fixation detection scanpath analysis"
  - category: applications
    query: "gaze interface assistive technology eye-controlled"
  - category: psychology
    query: "visual attention reading eye movements perception"
  - category: vr_ar
    query: "virtual reality eye tracking VR gaze AR augmented reality foveated rendering"
  - category: ml_ai
    query: "saliency prediction attention model gaze synthesis"
  - category: hci
    query: "human-computer interaction gaze input usability"
  - category: survey
    query: "eye tracking survey review state of the art"

# ── GitHub repository discovery (fetch_github_repos.py) ─────────────────────
github_queries:
  - query: "topic:eyetracking+stars:>100"
    category: hardware
    subcategory_hint: eye_trackers
  - query: "topic:gaze-tracking+stars:>50"
    category: algorithms
    subcategory_hint: gaze_estimation
  - query: "topic:eye-tracking+topic:hci+stars:>20"
    category: hci
    subcategory_hint: gaze_interfaces
  - query: "topic:pupillometry+stars:>10"
    category: hardware
    subcategory_hint: pupillometry
  - query: "OpenFace eye tracking stars:>50"
    category: applications
    subcategory_hint: assistive_tech

